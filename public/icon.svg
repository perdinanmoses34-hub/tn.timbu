<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" fill="#0F172A" opacity="0.2" />
  
  <!-- Smartphone frame -->
  <rect x="156" y="116" width="200" height="320" rx="36" fill="#0F172A" stroke="#38BDF8" stroke-width="12" />
  <!-- Screen content -->
  <rect x="176" y="156" width="160" height="230" rx="16" fill="#1E293B" />
  <!-- Screen URL bar -->
  <rect x="190" y="172" width="132" height="24" rx="8" fill="#334155" />
  <circle cx="204" cy="184" r="5" fill="#38BDF8" />
  <!-- Screen Web Cards -->
  <rect x="190" y="210" width="132" height="48" rx="8" fill="#2563EB" opacity="0.8" />
  <rect x="190" y="270" width="132" height="40" rx="8" fill="#334155" />
  <rect x="190" y="322" width="60" height="30" rx="8" fill="#10B981" />
  <!-- Camera notch -->
  <circle cx="256" cy="136" r="6" fill="#64748B" />
  <!-- Home indicator -->
  <rect x="231" y="408" width="50" height="6" rx="3" fill="#64748B" />
  
  <!-- Android Antenna Ears -->
  <line x1="210" y1="100" x2="190" y2="70" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" />
  <line x1="302" y1="100" x2="322" y2="70" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" />
</svg>
